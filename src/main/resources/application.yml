spring:
  application:
    name: demo
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://localhost:3306/emergencias?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
    username: root
    password:   #contraseña de usuarrio de la bd
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none        
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always          
      continue-on-error: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

# Integracion NASA EONET (Fase 4)
eonet:
  base-url: https://eonet.gsfc.nasa.gov/api/v3
jwt:
  secret: "" #agregar una clave con 32 caracteres alfanuméricos
  horas: 12